<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>怪兽沙盒模块排版工具</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="怪兽沙盒">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --border-light: #E5E5E5;
            --text-dark: #1D1D1F;
            --text-secondary: #6E6E73;
            --accent: #5E7A4A;
            --accent-hover: #4D6338;
            --danger: #C46A5C;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { width:100%; max-width:900px; display:flex; flex-direction:column; gap:12px; padding:0 12px 16px; }
        .header { background:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-light); position:sticky; top:0; z-index:50; width:100%; max-width:900px; margin:0 auto; }
        .header h1 { font-size:1.1rem; font-weight:500; }
        .help-icon { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:bold; cursor:pointer; border:none; }
        .card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:16px; }
        .section-title { font-size:0.9rem; font-weight:500; color:var(--text-dark); display:flex; align-items:center; gap:6px; }
        .preset-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(85px,1fr)); gap:8px; }
        .module-card { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 4px; border-radius:var(--radius-sm); background:#fff; box-shadow:var(--shadow-sm); cursor:pointer; position:relative; border:1px solid transparent; transition:all .2s; text-align:center; }
        .module-card.active { border-color:var(--accent); box-shadow:0 0 0 3px rgba(94,122,74,0.1); }
        .module-card .size-label { font-size:0.85rem; font-weight:500; }
        .module-card .color-dot { width:8px; height:8px; border-radius:50%; margin:4px 0; }
        .module-card .name-label { font-size:0.7rem; color:var(--text-secondary); }
        .module-card .delete-btn { position:absolute; top:4px; right:4px; width:16px; height:16px; background:rgba(0,0,0,0.2); color:#fff; border-radius:50%; font-size:10px; display:none; align-items:center; justify-content:center; cursor:pointer; }
        .module-card:hover .delete-btn { display:flex; }
        .custom-form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .custom-form input { width:48px; padding:6px 8px; border:1px solid #E5E5E5; border-radius:6px; font-size:0.82rem; text-align:center; }
        .custom-form input[type="color"] { width:32px; height:32px; padding:2px; }
        .custom-form .name-input { width:80px; }
        .btn { padding:10px 18px; border-radius:8px; border:none; background:#F5F5F7; color:var(--text-dark); font-weight:500; font-size:0.85rem; cursor:pointer; transition:all .2s; font-family:var(--font-sans); border:1px solid #E5E5E5; white-space:nowrap; min-height:44px; display:flex; align-items:center; justify-content:center; }
        .btn-accent { background:var(--accent); color:#fff; border:none; }
        .btn-danger { background:var(--danger); color:#fff; border:none; }
        .btn-sm { padding:6px 14px; font-size:0.78rem; }
        .btn-tool { width:100%; margin-bottom:6px; }

        .canvas-row { display:flex; gap:12px; flex:1; min-height:0; }
        .canvas-area { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:12px; flex:1; display:flex; flex-direction:column; min-width:0; }
        .canvas-wrapper { position:relative; overflow:auto; border-radius:var(--radius-sm); background:#fff; border:1px solid var(--border-light); touch-action:none; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
        canvas { display:block; flex-shrink:0; }
        .canvas-info { display:flex; flex-wrap:wrap; gap:10px; font-size:0.78rem; color:var(--text-secondary); margin-top:8px; }
        .canvas-info strong { font-weight:500; color:var(--text-dark); }
        .zoom-row { display:flex; align-items:center; gap:6px; }
        .zoom-row input[type="range"] { width:70px; accent-color:var(--accent); }

        .toolbar { display:flex; flex-direction:column; gap:8px; width:80px; flex-shrink:0; }
        .toolbar .btn { min-height:50px; font-size:0.8rem; padding:8px 4px; border-radius:10px; }

        .help-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:100; }
        .help-modal.open { display:flex; }
        .help-content { background:#fff; border-radius:20px; padding:28px 24px; max-width:380px; width:90%; box-shadow:0 20px 40px rgba(0,0,0,0.2); }
        .help-content h3 { font-size:1.2rem; font-weight:600; margin-bottom:16px; color:var(--accent); }
        .help-step { display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; }
        .help-step .num { background:var(--accent); color:#fff; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:600; flex-shrink:0; }
        .help-step p { font-size:0.85rem; color:var(--text-dark); margin:0; }
        .help-step strong { color:var(--accent); }
        .help-content .close-btn { margin-top:20px; padding:12px 20px; border-radius:12px; background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; width:100%; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="header">
    <h1>怪兽沙盒模块排版工具</h1>
    <button class="help-icon" id="btnHelp">?</button>
</div>
<div class="app-container">
    <div class="card" style="padding:12px;">
        <div class="section-title">📦 预设模块</div>
        <div class="preset-grid" id="presetModules"></div>
        <div class="section-title" style="margin-top:10px;">✏️ 自定义模块</div>
        <div class="custom-form">
            <span style="font-size:0.8rem;">宽</span><input type="number" id="customW" value="3" min="1" max="40">
            <span style="font-size:0.8rem;">高</span><input type="number" id="customH" value="3" min="1" max="40">
            <input type="color" id="customColor" value="#5E7A4A">
            <span style="font-size:0.8rem;">名称</span><input type="text" id="customName" value="自定义" class="name-input" placeholder="名称">
            <button class="btn btn-accent btn-sm" id="btnAddCustom">添加</button>
        </div>
    </div>

    <div class="canvas-row">
        <div class="canvas-area">
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                <span style="font-size:0.85rem;">底板</span>
                <input type="number" id="gridWidth" value="8" min="1" max="40" style="width:45px; padding:6px; border:1px solid #E5E5E5; border-radius:6px; text-align:center; font-size:0.85rem;">
                <span style="font-size:0.85rem;">×</span>
                <input type="number" id="gridHeight" value="8" min="1" max="40" style="width:45px; padding:6px; border:1px solid #E5E5E5; border-radius:6px; text-align:center; font-size:0.85rem;">
                <button class="btn btn-sm" id="btnApplyGrid">应用</button>
                <button class="btn btn-sm" id="btnClearAll" style="margin-left:auto;">清空</button>
            </div>
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="canvas-info">
                <span>占用 <strong id="statUsed">0</strong>/<strong id="statTotal">64</strong></span>
                <span>模块 <strong id="statModules">0</strong></span>
                <span>占用率 <strong id="statRatio">0%</strong></span>
                <div class="zoom-row" style="margin-left:auto;">
                    🔍 <input type="range" id="zoomSlider" min="20" max="200" value="100" step="5">
                    <span id="zoomVal">100%</span>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-tool" id="btnUndo" title="撤销">↶</button>
            <button class="btn btn-tool" id="btnRedo" title="重做">↷</button>
            <button class="btn btn-tool btn-danger" id="btnDelete" style="display:none;" title="删除选中">🗑</button>
            <button class="btn btn-tool btn-accent" id="btnPlace" style="display:none;" title="放置模块">✅</button>
            <button class="btn btn-tool" id="btnRotate" style="display:none;" title="旋转模块">↺</button>
            <span id="selectedInfo" style="font-size:0.7rem; text-align:center; color:var(--text-secondary);"></span>
        </div>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span id="statusText" style="background:rgba(94,122,74,0.08); color:var(--accent); padding:4px 12px; border-radius:12px; font-size:0.75rem;">就绪</span>
        <button class="btn btn-sm" id="btnSave">💾 保存</button>
        <button class="btn btn-sm" id="btnLoad">📂 加载</button>
        <button class="btn btn-sm" id="btnExport">📷 导出JPG</button>
        <button class="btn btn-sm" id="btnRename" style="display:none;">✎ 重命名</button>
    </div>
</div>

<div class="help-modal" id="helpModal">
    <div class="help-content">
        <h3>📖 快速上手</h3>
        <div class="help-step"><span class="num">1</span><p><strong>选模块</strong>：点击左侧模块卡片，进入放置模式。</p></div>
        <div class="help-step"><span class="num">2</span><p><strong>放模块</strong>：在网格上滑动预览位置，点击右侧 ✅ 确认放置。</p></div>
        <div class="help-step"><span class="num">3</span><p><strong>移模块</strong>：在模块上按住直接拖拽到新位置。</p></div>
        <div class="help-step"><span class="num">4</span><p><strong>删模块</strong>：单击模块选中（蓝框），点击右侧 🗑 按钮。</p></div>
        <div class="help-step"><span class="num">5</span><p><strong>旋转</strong>：放置模式下，点击右侧 ↺ 按钮旋转 90°。</p></div>
        <div class="help-step"><span class="num">6</span><p><strong>缩放/平移</strong>：滑块或双指缩放；空白区域拖拽平移。</p></div>
        <div class="help-step"><span class="num">7</span><p><strong>撤销/重做</strong>：点击 ↶ / ↷ 按钮，或键盘 Ctrl+Z / Ctrl+Y。</p></div>
        <button class="close-btn" id="btnCloseHelp">我知道啦</button>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const presetModulesEl = document.getElementById('presetModules');
    const statUsed = document.getElementById('statUsed');
    const statTotal = document.getElementById('statTotal');
    const statModules = document.getElementById('statModules');
    const statRatio = document.getElementById('statRatio');
    const statusText = document.getElementById('statusText');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    const btnRename = document.getElementById('btnRename');
    const btnDelete = document.getElementById('btnDelete');
    const btnPlace = document.getElementById('btnPlace');
    const btnRotate = document.getElementById('btnRotate');
    const selectedInfo = document.getElementById('selectedInfo');
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    const btnSave = document.getElementById('btnSave');
    const btnLoad = document.getElementById('btnLoad');
    const btnExport = document.getElementById('btnExport');
    const btnHelp = document.getElementById('btnHelp');
    const helpModal = document.getElementById('helpModal');
    const btnCloseHelp = document.getElementById('btnCloseHelp');

    const DEFAULT_CELL_SIZE = 52;
    const CM_PER_CELL = 2.5;
    let gridWidth = 8, gridHeight = 8, cellSize = DEFAULT_CELL_SIZE, zoom = 1.0;
    let placedModules = [];
    let moduleIdCounter = 0;
    let appState = 'idle';
    let selectedTemplate = null;
    let hoveredGridX = -1, hoveredGridY = -1;
    let movingModuleId = null, movingModuleOrigX = null, movingModuleOrigY = null;
    let isDragging = false;
    let selectedModuleId = null;

    let initialPinchDist = 0;
    let initialZoom = 1.0;
    let panning = false;
    let panStartX = 0, panStartY = 0;
    let panStartScrollX = 0, panStartScrollY = 0;

    let animationFrameId = null;
    let animatingModule = null;
    const PLACEMENT_ANIM_DURATION = 150;

    const MAX_HISTORY = 50;
    let history = [];
    let historyIndex = -1;

    const paletteColors = [
        '#5E7A4A', '#C4825C', '#D4A373', '#A3B18A', '#E9C46A',
        '#F4A261', '#E76F51', '#2A9D8F', '#588157', '#6D6875',
        '#B5838D', '#E5989B', '#FFB4A2', '#B5838D', '#6D6875'
    ];
    let paletteIndex = 0;

    const presetTemplates = [
        { width:4, height:8, name:'4×8' }, { width:8, height:4, name:'8×4' },
        { width:4, height:5, name:'4×5' }, { width:5, height:4, name:'5×4' },
        { width:1, height:1, name:'1×1' }, { width:2, height:2, name:'2×2' },
        { width:2, height:4, name:'2×4' }, { width:4, height:2, name:'4×2' },
        { width:3, height:3, name:'3×3' }, { width:2, height:3, name:'2×3' },
        { width:3, height:2, name:'3×2' }, { width:6, height:4, name:'6×4' }
    ];
    let availableTemplates = [];

    function initTemplates() {
        availableTemplates = presetTemplates.map((t,i) => ({
            ...t, color: paletteColors[i % paletteColors.length], id:'preset_'+i
        }));
        paletteIndex = presetTemplates.length % paletteColors.length;
    }
    initTemplates();

    function getNextColor() { return paletteColors[paletteIndex++ % paletteColors.length]; }

    function saveState() {
        if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
        history.push(placedModules.map(m => ({...m})));
        if (history.length > MAX_HISTORY) history.shift();
        else historyIndex = history.length - 1;
        updateUndoRedoButtons();
    }
    function loadState(snapshot) { placedModules = snapshot.map(m => ({...m})); clearSelection(); animatingModule = null; render(); }
    function undo() { if (historyIndex > 0) { historyIndex--; loadState(history[historyIndex]); setStatus('info','已撤销'); } }
    function redo() { if (historyIndex < history.length - 1) { historyIndex++; loadState(history[historyIndex]); setStatus('info','已重做'); } }
    function updateUndoRedoButtons() { btnUndo.style.opacity = historyIndex > 0 ? '1' : '0.5'; btnRedo.style.opacity = historyIndex < history.length - 1 ? '1' : '0.5'; }

    function saveToStorage() { localStorage.setItem('monster_layout', JSON.stringify({gridWidth, gridHeight, placedModules})); setStatus('success','布局已保存'); }
    function loadFromStorage() {
        const saved = localStorage.getItem('monster_layout');
        if(!saved) { setStatus('warning','没有已保存的布局'); return; }
        try {
            const data = JSON.parse(saved);
            gridWidth = data.gridWidth || 8; gridHeight = data.gridHeight || 8;
            document.getElementById('gridWidth').value = gridWidth;
            document.getElementById('gridHeight').value = gridHeight;
            placedModules = data.placedModules || [];
            moduleIdCounter = placedModules.reduce((max,m)=>Math.max(max,m.id||0),0)+1;
            history = [placedModules.map(m=>({...m}))]; historyIndex = 0;
            updateCanvasSize(); clearSelection(); render();
            setStatus('success','布局已加载');
        } catch(e) { setStatus('warning','加载失败'); }
    }

    function exportToJPG() {
        const PADDING = 40;
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = canvas.width + PADDING*2;
        exportCanvas.height = canvas.height + PADDING*2;
        const exportCtx = exportCanvas.getContext('2d');
        exportCtx.fillStyle = '#FFFFFF';
        exportCtx.fillRect(0,0,exportCanvas.width, exportCanvas.height);
        exportCtx.drawImage(canvas, PADDING, PADDING);
        exportCanvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `怪兽沙盒排版_${gridWidth}x${gridHeight}.jpg`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus('success','排版图已导出');
        }, 'image/jpeg', 0.95);
    }

    function getCanvasCoordsFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
    }
    function getGridCell(cx, cy) { const gx = Math.floor(cx / cellSize), gy = Math.floor(cy / cellSize); return (gx>=0 && gx<gridWidth && gy>=0 && gy<gridHeight) ? {gx,gy} : null; }
    function getModuleBounds(m) { return { x1:m.gridX, y1:m.gridY, x2:m.gridX+m.width-1, y2:m.gridY+m.height-1 }; }
    function rectsOverlap(a,b) { return !(a.x2<b.x1 || a.x1>b.x2 || a.y2<b.y1 || a.y1>b.y2); }
    function isPlacementValid(gx,gy,w,h,excludeId=null) {
        if(gx<0||gy<0||gx+w>gridWidth||gy+h>gridHeight) return false;
        const cand = {x1:gx,y1:gy,x2:gx+w-1,y2:gy+h-1};
        for(const m of placedModules) if(m.id!==excludeId && rectsOverlap(cand, getModuleBounds(m))) return false;
        return true;
    }
    function getModuleAt(gx,gy) { for(const m of placedModules) { const b = getModuleBounds(m); if(gx>=b.x1 && gx<=b.x2 && gy>=b.y1 && gy<=b.y2) return m; } return null; }

    function placeModule(gx, gy, template) {
        if(!isPlacementValid(gx,gy,template.width,template.height)) return false;
        saveState();
        const newMod = { id: moduleIdCounter++, name: template.name, width: template.width, height: template.height, gridX: gx, gridY: gy, color: template.color, animScale: 1.0 };
        placedModules.push(newMod);
        appState = 'idle'; selectedTemplate = null;
        updateCardsHighlight(); updatePlacementUI();
        startPlacementAnimation(newMod.id);
        render();
        setStatus('success', `已放置：${newMod.name}`);
        return true;
    }

    function startPlacementAnimation(moduleId) {
        const mod = placedModules.find(m => m.id === moduleId);
        if (!mod) return;
        mod.animScale = 0.85;
        animatingModule = { id: moduleId, startTime: performance.now(), duration: PLACEMENT_ANIM_DURATION, fromScale: 0.85, toScale: 1.0 };
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        function animate(now) {
            if (!animatingModule) return;
            const mod = placedModules.find(m => m.id === animatingModule.id);
            if (!mod) { animatingModule = null; return; }
            const elapsed = now - animatingModule.startTime;
            const progress = Math.min(elapsed / animatingModule.duration, 1.0);
            const eased = 1 - Math.pow(1 - progress, 3);
            mod.animScale = animatingModule.fromScale + (animatingModule.toScale - animatingModule.fromScale) * eased;
            render();
            if (progress < 1.0) animationFrameId = requestAnimationFrame(animate);
            else { mod.animScale = 1.0; animatingModule = null; render(); }
        }
        animationFrameId = requestAnimationFrame(animate);
    }

    function removeModule(id) { saveState(); const idx = placedModules.findIndex(m=>m.id===id); if(idx>=0) { placedModules.splice(idx,1); if(selectedModuleId === id) clearSelection(); render(); setStatus('warning','已删除模块'); } }
    function moveModuleTo(id, newX, newY) {
        const mod = placedModules.find(m=>m.id===id);
        if(!mod || !isPlacementValid(newX,newY,mod.width,mod.height,id)) return false;
        saveState();
        mod.gridX = newX; mod.gridY = newY;
        render(); setStatus('info', `已移动：${mod.name}`);
        return true;
    }
    function renameModule(id, newName) { const mod = placedModules.find(m=>m.id===id); if(mod && newName.trim()) { saveState(); mod.name = newName.trim(); render(); updateSelectionInfo(); setStatus('info',`已重命名：${mod.name}`); } }

    function clearSelection() { selectedModuleId = null; btnDelete.style.display = 'none'; btnRename.style.display = 'none'; selectedInfo.textContent = ''; render(); }
    function selectModule(id) { selectedModuleId = id; const mod = placedModules.find(m=>m.id===id); if(mod) { btnDelete.style.display = 'block'; btnRename.style.display = 'inline-block'; selectedInfo.textContent = `选中：${mod.name}`; } render(); }
    function updateSelectionInfo() { if(selectedModuleId) { const mod = placedModules.find(m=>m.id===selectedModuleId); if(mod) selectedInfo.textContent = `选中：${mod.name}`; else clearSelection(); } }

    function clearAll() { if(placedModules.length && confirm('清空所有模块？')) { saveState(); placedModules = []; appState='idle'; selectedTemplate=null; clearSelection(); updatePlacementUI(); render(); setStatus('warning','已清空'); } }

    function rotateTemplate() { if(appState==='placing' && selectedTemplate) { const w=selectedTemplate.width, h=selectedTemplate.height; selectedTemplate.width=h; selectedTemplate.height=w; setStatus('info',`已旋转：${selectedTemplate.name}`); render(); } }

    function updatePlacementUI() { const isPlacing = appState === 'placing'; btnPlace.style.display = isPlacing ? 'block' : 'none'; btnRotate.style.display = isPlacing ? 'block' : 'none'; }

    function setStatus(type, msg) { statusText.textContent = msg; clearTimeout(statusText._timeout); statusText._timeout = setTimeout(()=>{ statusText.textContent='就绪'; }, 2500); }

    function updateCardsHighlight() { document.querySelectorAll('.module-card').forEach(card => { card.classList.toggle('active', appState==='placing' && selectedTemplate && selectedTemplate._cardId===card.dataset.templateId); }); }

    function selectTemplate(index) {
        const tmpl = availableTemplates[index];
        selectedTemplate = { width:tmpl.width, height:tmpl.height, color:tmpl.color, name:tmpl.name, _cardId:'tmpl_'+index };
        appState='placing'; clearSelection();
        updateCardsHighlight(); updatePlacementUI(); render();
        setStatus('info',`已选择：${tmpl.name}，移动预览后点击 ✅ 放置`);
    }

    function cancelPlacing() { if(appState==='placing') { appState='idle'; selectedTemplate=null; updateCardsHighlight(); updatePlacementUI(); } render(); setStatus('info','已取消'); }

    const LABEL_MARGIN_BOTTOM = 30;
    const LABEL_MARGIN_RIGHT = 45;

    function updateCanvasSize() {
        const w = gridWidth * cellSize + LABEL_MARGIN_RIGHT;
        const h = gridHeight * cellSize + LABEL_MARGIN_BOTTOM;
        canvas.width = w; canvas.height = h;
        canvas.style.width = w * zoom + 'px';
        canvas.style.height = h * zoom + 'px';
    }

    function centerCanvas() {
        const cw = canvasWrapper.clientWidth;
        const ch = canvasWrapper.clientHeight;
        const canvasW = canvas.width * zoom;
        const canvasH = canvas.height * zoom;
        canvasWrapper.scrollLeft = (canvasW - cw) / 2;
        canvasWrapper.scrollTop = (canvasH - ch) / 2;
    }

    function applyZoom(newZoom) {
        zoom = Math.min(2.0, Math.max(0.2, newZoom));
        updateCanvasSize();
        centerCanvas();
        zoomSlider.value = Math.round(zoom * 100);
        zoomVal.textContent = Math.round(zoom * 100) + '%';
        render();
    }

    function roundRectPath(ctx, x, y, w, h, r) {
        ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
    }

    function render() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = '#fefefc'; ctx.fillRect(0,0,w,h);
        const gridW = gridWidth * cellSize, gridH = gridHeight * cellSize;
        for(let x=0; x<=gridWidth; x++) { ctx.strokeStyle = (x%4===0)?'#c0b7aa':'#e8e3db'; ctx.lineWidth = (x%4===0)?1.2:0.5; ctx.beginPath(); ctx.moveTo(x*cellSize,0); ctx.lineTo(x*cellSize, gridH); ctx.stroke(); }
        for(let y=0; y<=gridHeight; y++) { ctx.strokeStyle = (y%4===0)?'#c0b7aa':'#e8e3db'; ctx.lineWidth = (y%4===0)?1.2:0.5; ctx.beginPath(); ctx.moveTo(0,y*cellSize); ctx.lineTo(gridW, y*cellSize); ctx.stroke(); }
        ctx.strokeStyle = '#1D1D1F'; ctx.lineWidth = 2.5; ctx.strokeRect(0,0,gridW,gridH);
        ctx.fillStyle = '#1D1D1F'; ctx.font = `500 ${Math.max(9, cellSize*0.18)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for(let x=0; x<=gridWidth; x++) ctx.fillText((x*CM_PER_CELL).toFixed(1), x*cellSize, gridH+4);
        ctx.fillText(`${(gridWidth*CM_PER_CELL).toFixed(1)}cm`, gridW/2, gridH+20);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for(let y=0; y<=gridHeight; y++) ctx.fillText((y*CM_PER_CELL).toFixed(1), gridW+4, y*cellSize);
        ctx.save(); ctx.translate(gridW+22, gridH/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText(`${(gridHeight*CM_PER_CELL).toFixed(1)}cm`, 0, 0); ctx.restore();

        if(zoom*cellSize >= 14) {
            ctx.fillStyle = '#b5aaa0'; ctx.font = `${Math.max(8, cellSize*0.2)}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for(let x=0; x<gridWidth; x++) for(let y=0; y<gridHeight; y++) ctx.fillText(`${x+1},${y+1}`, (x+0.5)*cellSize, (y+0.5)*cellSize);
        }

        for(const mod of placedModules) {
            const isSelected = (mod.id === selectedModuleId);
            const scale = mod.animScale || 1.0;
            drawModule(mod.gridX, mod.gridY, mod.width, mod.height, mod.color, mod.name, 1.0, false, null, isSelected, scale);
        }

        if(appState==='placing' && selectedTemplate && hoveredGridX>=0 && hoveredGridY>=0) {
            const valid = isPlacementValid(hoveredGridX,hoveredGridY,selectedTemplate.width,selectedTemplate.height);
            drawModule(hoveredGridX,hoveredGridY,selectedTemplate.width,selectedTemplate.height, selectedTemplate.color,selectedTemplate.name, valid?0.55:0.3, false, valid?'#5E7A4A':'#C4825C');
        }
        updateStats();
    }

    function drawModule(gx,gy,mw,mh,color,name,alpha,ghost=false,borderColor=null,selected=false,scale=1.0) {
        const x=gx*cellSize, y=gy*cellSize, w=mw*cellSize, h=mh*cellSize;
        const pad=2, radius=Math.min(cellSize*0.2,12);
        ctx.save(); const cx=x+w/2, cy=y+h/2;
        ctx.translate(cx,cy); ctx.scale(scale,scale); ctx.translate(-cx,-cy);
        const rx=x+pad, ry=y+pad, rw=w-pad*2, rh=h-pad*2;
        ctx.fillStyle = hexToRgba(color, alpha);
        roundRectPath(ctx, rx, ry, rw, rh, radius); ctx.fill();
        ctx.strokeStyle = borderColor || (ghost?'rgba(255,255,255,0.9)':'rgba(0,0,0,0.15)');
        ctx.lineWidth = ghost?2.5:1.5; if(ghost) ctx.setLineDash([5,3]);
        if(selected && !ghost) { ctx.strokeStyle = '#5E7A4A'; ctx.lineWidth = 3; ctx.setLineDash([4,2]); }
        roundRectPath(ctx, rx, ry, rw, rh, radius); ctx.stroke(); ctx.setLineDash([]);
        if(Math.min(rw,rh)>18 && alpha>0.4) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.font = `500 ${Math.max(7, Math.min(cellSize*0.35, Math.min(rw,rh)*0.35))}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(name, cx, cy);
        }
        ctx.restore();
    }
    function hexToRgba(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
    function updateStats(){ const total=gridWidth*gridHeight; const used=new Set(); for(const m of placedModules) for(let dx=0;dx<m.width;dx++) for(let dy=0;dy<m.height;dy++) used.add(`${m.gridX+dx},${m.gridY+dy}`); statUsed.textContent=used.size; statTotal.textContent=total; statModules.textContent=placedModules.length; statRatio.textContent=total?Math.round((used.size/total)*100)+'%':'0%'; }
    function getTouchDist(touches){ if(touches.length<2) return 0; const dx=touches[0].clientX-touches[1].clientX, dy=touches[0].clientY-touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); }

    // ---------- 全新交互：纯拖拽移动，单击选中 ----------
    let dragStartPos = null; // 记录拖拽起始坐标 {x, y}
    let dragMoved = false;

    function onPointerDown(e) {
        e.preventDefault();
        const touches = e.touches;
        if(touches && touches.length === 2) { initialPinchDist = getTouchDist(touches); initialZoom = zoom; return; }
        const coords = getCanvasCoordsFromEvent(e);
        const cell = getGridCell(coords.x, coords.y);
        const clientX = touches ? touches[0].clientX : e.clientX;
        const clientY = touches ? touches[0].clientY : e.clientY;

        if(e.button === 2 || (touches && touches.length > 1)) {
            if(cell && appState==='idle') { const m = getModuleAt(cell.gx,cell.gy); if(m) removeModule(m.id); }
            return;
        }

        if(appState === 'placing') {
            if(cell) { hoveredGridX = cell.gx; hoveredGridY = cell.gy; render(); }
            return;
        }

        if(appState === 'idle' && cell) {
            const mod = getModuleAt(cell.gx, cell.gy);
            if(mod) {
                // 开始可能拖拽
                movingModuleId = mod.id;
                movingModuleOrigX = mod.gridX;
                movingModuleOrigY = mod.gridY;
                dragStartPos = { x: clientX, y: clientY };
                dragMoved = false;
                isDragging = false;
            } else {
                clearSelection();
                panStartX = clientX; panStartY = clientY;
                panStartScrollX = canvasWrapper.scrollLeft;
                panStartScrollY = canvasWrapper.scrollTop;
                appState = 'panning';
            }
            return;
        }
    }

    function onPointerMove(e) {
        e.preventDefault();
        const touches = e.touches;
        if(touches && touches.length === 2 && initialPinchDist > 0) {
            const newDist = getTouchDist(touches);
            applyZoom(initialZoom * newDist / initialPinchDist);
            return;
        }
        const clientX = touches ? touches[0].clientX : e.clientX;
        const clientY = touches ? touches[0].clientY : e.clientY;

        if(appState === 'panning') {
            const dx = clientX - panStartX, dy = clientY - panStartY;
            if(Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                canvasWrapper.scrollLeft = panStartScrollX - dx;
                canvasWrapper.scrollTop = panStartScrollY - dy;
            }
            return;
        }

        const coords = getCanvasCoordsFromEvent(e);
        const cell = getGridCell(coords.x, coords.y);
        if(appState === 'placing') { if(cell) { hoveredGridX = cell.gx; hoveredGridY = cell.gy; render(); } return; }
        hoveredGridX = cell?cell.gx:-1; hoveredGridY = cell?cell.gy:-1;

        // 拖拽模块逻辑
        if(movingModuleId && !isDragging && dragStartPos) {
            const dx = clientX - dragStartPos.x;
            const dy = clientY - dragStartPos.y;
            if(Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                // 开始拖拽移动
                isDragging = true;
                dragMoved = true;
                appState = 'moving';
                setStatus('info','移动中...');
                // 将模块移动到当前格子
                if(cell) {
                    const mod = placedModules.find(m=>m.id===movingModuleId);
                    if(mod) { mod.gridX = cell.gx; mod.gridY = cell.gy; }
                }
            }
        }

        if(appState === 'moving' && movingModuleId && cell) {
            const mod = placedModules.find(m=>m.id===movingModuleId);
            if(mod) { mod.gridX = cell.gx; mod.gridY = cell.gy; }
        }
        render();
    }

    function onPointerUp(e) {
        e.preventDefault();
        if(e.touches && e.touches.length < 2) initialPinchDist = 0;
        if(appState === 'panning') { appState = 'idle'; return; }

        // 处理拖拽结束
        if(appState === 'moving' && movingModuleId) {
            const mod = placedModules.find(m=>m.id===movingModuleId);
            const finalX = mod?mod.gridX:0, finalY = mod?mod.gridY:0;
            if(finalX === movingModuleOrigX && finalY === movingModuleOrigY) {
                // 没移动，恢复并选中
                if(mod) { mod.gridX = movingModuleOrigX; mod.gridY = movingModuleOrigY; }
                selectModule(movingModuleId);
            } else {
                if(!moveModuleTo(movingModuleId, finalX, finalY)) {
                    if(mod) { mod.gridX = movingModuleOrigX; mod.gridY = movingModuleOrigY; }
                    setStatus('warning','无法放置到该位置');
                }
            }
            appState = 'idle'; movingModuleId = null; isDragging = false; dragStartPos = null;
            render();
            return;
        }

        // 如果按在模块上但未拖拽，视为单击选中
        if(movingModuleId && !dragMoved) {
            selectModule(movingModuleId);
            movingModuleId = null; dragStartPos = null;
            render();
            return;
        }

        movingModuleId = null; dragStartPos = null; dragMoved = false;
        render();
    }

    function onPointerLeave(e) {
        if(appState === 'panning') appState = 'idle';
        if(appState === 'moving' && movingModuleId) {
            const mod = placedModules.find(m=>m.id===movingModuleId);
            if(mod) { mod.gridX = movingModuleOrigX; mod.gridY = movingModuleOrigY; }
            appState = 'idle'; movingModuleId = null; isDragging = false; dragStartPos = null;
        }
        hoveredGridX = -1; hoveredGridY = -1;
        render();
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerLeave);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchmove', onPointerMove, {passive: false});
    canvas.addEventListener('touchend', onPointerUp);
    canvas.addEventListener('touchcancel', onPointerLeave);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // 双击重命名
    canvas.addEventListener('dblclick', e => {
        const coords = getCanvasCoordsFromEvent(e);
        const cell = getGridCell(coords.x, coords.y);
        if (!cell || appState !== 'idle') return;
        const mod = getModuleAt(cell.gx, cell.gy);
        if(mod) { const newName = prompt('重命名模块：', mod.name); if(newName) renameModule(mod.id, newName); }
    });

    btnPlace.addEventListener('click', () => { if(appState==='placing' && selectedTemplate && hoveredGridX>=0 && hoveredGridY>=0) placeModule(hoveredGridX, hoveredGridY, selectedTemplate); else setStatus('warning','请先移动预览到目标位置'); });
    btnRotate.addEventListener('click', rotateTemplate);
    btnDelete.addEventListener('click', () => { if(selectedModuleId) { removeModule(selectedModuleId); clearSelection(); } });
    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);
    btnSave.addEventListener('click', saveToStorage);
    btnLoad.addEventListener('click', loadFromStorage);
    btnExport.addEventListener('click', exportToJPG);
    btnRename.addEventListener('click', () => { if(selectedModuleId) { const mod = placedModules.find(m=>m.id===selectedModuleId); if(mod) { const n = prompt('新名称：', mod.name); if(n) renameModule(mod.id, n); } } });

    btnHelp.addEventListener('click', () => helpModal.classList.add('open'));
    btnCloseHelp.addEventListener('click', () => helpModal.classList.remove('open'));
    helpModal.addEventListener('click', e => { if(e.target === helpModal) helpModal.classList.remove('open'); });

    document.addEventListener('keydown', e => {
        if(e.key==='Escape') cancelPlacing();
        if((e.key==='Delete'||e.key==='Backspace') && selectedModuleId) { removeModule(selectedModuleId); clearSelection(); }
        if(e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); }
        if(e.ctrlKey && e.key==='y') { e.preventDefault(); redo(); }
    });

    document.getElementById('btnApplyGrid').addEventListener('click', ()=>{
        const nw = parseInt(document.getElementById('gridWidth').value);
        const nh = parseInt(document.getElementById('gridHeight').value);
        if(isNaN(nw)||isNaN(nh)||nw<1||nh<1) return;
        const out = placedModules.filter(m=>m.gridX+m.width>nw||m.gridY+m.height>nh);
        if(out.length && !confirm(`有${out.length}个模块超出边界将被移除，继续？`)) return;
        saveState();
        placedModules = placedModules.filter(m=>m.gridX+m.width<=nw && m.gridY+m.height<=nh);
        gridWidth=nw; gridHeight=nh;
        document.getElementById('gridWidth').value=nw; document.getElementById('gridHeight').value=nh;
        cancelPlacing(); updateCanvasSize(); centerCanvas(); render();
        setStatus('info','底板尺寸已更新');
    });
    document.getElementById('btnClearAll').addEventListener('click', clearAll);
    document.getElementById('btnAddCustom').addEventListener('click', ()=>{
        const cw=parseInt(document.getElementById('customW').value), ch=parseInt(document.getElementById('customH').value);
        const color=document.getElementById('customColor').value;
        let name=document.getElementById('customName').value.trim() || `${cw}×${ch}`;
        if(isNaN(cw)||isNaN(ch)||cw<1||ch<1) return;
        availableTemplates.push({width:cw,height:ch,name:name,color:color,id:'custom_'+Date.now()});
        renderPresetModules();
        selectTemplate(availableTemplates.length-1);
    });

    zoomSlider.addEventListener('input', ()=> applyZoom(parseInt(zoomSlider.value)/100) );

    function renderPresetModules() {
        presetModulesEl.innerHTML = '';
        availableTemplates.forEach((tmpl, idx) => {
            const card = document.createElement('div');
            card.className = 'module-card';
            card.dataset.templateId = 'tmpl_'+idx;
            card.innerHTML = `<span class="size-label">${tmpl.width}×${tmpl.height}</span><span class="color-dot" style="background:${tmpl.color};"></span><span class="name-label">${tmpl.name}</span><div class="delete-btn">✕</div>`;
            card.addEventListener('click', e => { if(e.target.classList.contains('delete-btn')) return; selectTemplate(idx); });
            card.querySelector('.delete-btn').addEventListener('click', e => { e.stopPropagation(); availableTemplates.splice(idx,1); if(selectedTemplate && selectedTemplate._cardId==='tmpl_'+idx) { appState='idle'; selectedTemplate=null; updateCardsHighlight(); updatePlacementUI(); } renderPresetModules(); });
            presetModulesEl.appendChild(card);
        });
        updateCardsHighlight();
    }

    function autoFitZoom() {
        const rect = canvasWrapper.getBoundingClientRect();
        const availW = rect.width - 20, availH = rect.height - 20;
        if(availW<=0||availH<=0) zoom=1.0;
        else {
            zoom = Math.min(availW/(gridWidth*cellSize+LABEL_MARGIN_RIGHT), availH/(gridHeight*cellSize+LABEL_MARGIN_BOTTOM), 2.0);
            zoom = Math.max(0.2, Math.min(2.0, zoom));
        }
        zoom = Math.round(zoom*100)/100;
        zoomSlider.value = Math.round(zoom*100);
        zoomVal.textContent = Math.round(zoom*100)+'%';
        updateCanvasSize();
        centerCanvas();
        render();
    }

    window.addEventListener('resize', () => { clearTimeout(window._resizeTimer); window._resizeTimer = setTimeout(()=>{ autoFitZoom(); }, 200); });

    history.push(placedModules.map(m=>({...m}))); historyIndex = 0;
    renderPresetModules(); updateCanvasSize(); autoFitZoom();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('SW 注册成功', reg.scope))
                .catch(err => console.log('SW 注册失败', err));
        });
    }
})();
</script>
